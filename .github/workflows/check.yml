name: Check website and APIs
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm test
      - name: Install isolated Vercel builder
        run: npm install --prefix "$RUNNER_TEMP/hueart-vercel-tools" --no-audit --no-fund @vercel/node@30.0.0 @vercel/build-utils@15.3.0
      - name: Check native Vercel function build and runtime
        run: node scripts/check-vercel-function.cjs "$RUNNER_TEMP/hueart-vercel-tools"
      - run: npm run build:vercel
