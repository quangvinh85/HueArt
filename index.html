    <!-- Polyfill & Safeguard for Browser Extensions attempting to set window.fetch -->
    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return nativeFetch;
            },
            set: function(newFetch) {
              nativeFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if property is strictly sealed
        }

        // Prevent browser extension runtime errors from surfacing as application errors
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            event.reason.stack &&
            (event.reason.stack.indexOf('chrome-extension://') !== -1 || event.reason.stack.indexOf('moz-extension://') !== -1)
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
